@Kopernicus:AFTER[Q_TPR]
{
	@Body:HAS[#identifier[Squad/Sun]]
	{
		@Properties
		{
			%description = The Sun, known to the ancients and sci-fi fanatics as <color=#FFE8CE>"Kerbol,"</color> is the perhaps the most well known object in the daytime sky, exceeding the notoriety of clouds by a narrow margin and bricks by a wider margin.\n\nScientists have noted a particular burning sensation and potential loss of vision if it is stared at for long periods of time. This is especially important to keep in mind considering the effect shiny objects have on the average Kerbal.\n\nDespite its apparent motion across the sky, Kerbol is not a planet, but actually a star with a spectral type of <color=#FFE8CE>K2V.</color> Kerbol was once thought to be a large lump of burning coal, but in this more refined and enlightened age, we know it to be powered by the same kinds of nuclear reactions at play within hydrogen fusion bombs.
			
			//Kerbol luminosity: 0.82646281 Lsol (given by Kerbin's orbit)
			//Kerbol radius: 0.8359 Rsol (given in config)
			//Kerbol mass: 0.883 Msol (stock)
			//Kerbol temperature: 5056 K (T = L^(1/4) * R^(1/2))
		}
	}
	
	@Body:HAS[#identifier[Squad/Moho]]
	{
		@Properties
		{
			%description = <color=#885644>Moho</color> figures in Kerbal mythology as a fiery place with oceans of flowing lava. The traditional depiction of Moho is that of a world rotating in lock step with its orbit, one side molten and facing the Sun, and one side frozen in permanent night.\n\nHowever, recent telescopic measurements have shown that Moho is not, as previously thought, tidally locked to the Sun. It instead rotates three times for every two orbits around the Sun, so the heat is too evenly distributed for any of its surface to be molten. \n\nScientists speculate about possible ways to make it "awesome like in the stories". Some of those ideas have led to new breakthroughs in aerospace technology.
		}
	}
	
	@Body:HAS[#identifier[Squad/Eve]]
	{
		@Properties
		{
			%description = <color=#D383CF>Eve</color> is certainly the purplest object in the solar system. It is easy to tell apart from the fixed stars because it is much brighter and purpler. No star has yet been found that matches Eve's hue, though the search continues.\n\nEve is considered by some to be almost a sister planet to Kerbin, however the traditional imagery of a world covered in purple jungles has been upset by modern spectroscopic studies, which indicate a thick atmosphere lacking in oxygen. Also, the planet has much higher gravity than Kerbin. And it's much larger. And it's a different color. If our space program were on Eve, it's doubtful we'd ever manage to reach orbit. So actually, it's not much like Kerbin at all! \n\nWhatever the case may be, its surface remains shrouded in mystery--and a thick layer of lavender cloud cover.
		}
	}
	@Body:HAS[#identifier[Squad/Gilly]]
	{
		@Properties
		{
			%description = <color=#7F6546>Gilly</color> is a tiny rock wandering around the orbit of Eve. It’s by far the smallest natural satellite discovered by visual observations. It was discovered by Stickney Kerman using a 24" aperture Great Refractor at the Kerbal Naval Observatory, after months of careful study of Eve.\n Stickney's assistant bothered her to no end, and was only there so that he'd get to take shared credit for whatever Stickney found. One night, her assistant was a no show--he had weaseled his way into a banquet to mingle with politicians. Naturally, Stickney announced her discovery of Gilly that very night.\n\nDue to the large amount of squinting and eye strain associated with Gilly's discovery, being a "glasses girl" has now become synonymous with being an accomplished Astronomer.\n\n\n\n\n<color=#B2B2B2>[Editor's Note: the "Naval Observatory" is so named not due to its association with any militaries, but because the dome is painted a lovely shade of dark blue.]</color>
		}
	}
	
	@Body:HAS[#identifier[Squad/Kerbin]]
	{
		@Properties
		{
			%description = A unique world, <color=#3C82AA>Kerbin</color> has flat plains, soaring mountains and wide, blue oceans. Home to the Kerbals, it has just the right conditions to support a vast, seemingly undepletable population of the eager green creatures.\n\nKerbin is the only place in the solar system known to have snacks, though we are optimistic that further space exploration will render this statement outdated.\n\nReaching a stable orbit around Kerbin is one of the first things a space program must strive for. It is said that a kerbal who can get their ship into orbit is halfway to anywhere. Indeed, for some interplanetary missions the launch from Kerbin makes up around half of the total delta-v.\n\n\n\n\n<color=#B2B2B2>[Editor's note: Alright, who's the wise kerb who replaced "life" with "snacks"? We're gonna have to issue a reprint.]</color>
		}
	}
	@Body:HAS[#identifier[Squad/Mun]]
	{
		@Properties
		{
			%description = <color=#D8D2D2>The Mun</color> is a large satellite orbiting Kerbin. The first astronomers to look at the Mun with a telescope observed large grey flat regions, and called them "seas", because the color blue hadn't been invented yet.\n\nIn the highlands above the seas, the Mun's surface is covered in circular depressions, termed "craters," which were until recently thought to be the result of numerous volcanic explosions. Thanks to the recent discovery of a giant crater on Kerbin, we now have a better idea of how these craters were formed: It is thought that asteroids travelling at many kilometers per second have struck the Mun over the eons, each impact forming an impact crater.\n\nNote: The Mun lacks an atmosphere. Do not attempt to slow down using parachutes, unless you want to take part in the formation of a new crater.
		}
	}
	@Body:HAS[#identifier[Squad/Minmus]]
	{
		@Properties
		{
			%description = <color=#66B7C1>Minmus</color> is the smallest moon orbiting Kerbin. From the surface of Kerbin, it can be seen on clear days as a tiny blue speck in the sky, and at night it shines as a mint-colored dot brighter than any planet.\n\nIt is often mistaken for dead pixels, but the top minds at the Kerbal Astronomical Society assure us it is a real moon nevertheless. After the discovery that planets orbit the Sun and not Kerbin, it was long assumed that Minmus orbited the Sun as well. This assumption made it into several important world religions, and so when Petit Kerman discovered that Minmus actually orbited Kerbin, he was put on house arrest. Kerbals have since slain their gods and so Petit's "Kerbicentric Minmus" Theory is now accepted.\n\nThere are still adherents to the Old Ways who insist Minmus is a planet, but it is hoped that a successful space mission to visit Minmus will pursuade them otherwise.
			
			//for Reborn mode (See bottom of this config), in which Minmus becomes a quasisatellite even though it's WAY COOLER AS A MOON:			//hey it's clover: you're wrong
			
			descriptionReborn = <color=#66B7C1>Minmus,</color> often hailed as "Kerbin's second moon," is a controversial object. From the surface of Kerbin, it can be seen on clear nights as a tiny blue speck in the sky.\n\nIt is often mistaken as dirt on telescope eyepieces or dead pixels, but the top minds at the Kerbal Astronomical Society assure us it is a real celestial object nevertheless. After the discovery that the planets orbit the Sun and not Kerbin, the Mun and Minmus became the last hope for Kerbicentrists. The assumption that Minmus orbited Kerbin made it into several important world religions, and so when Cardea Kerman discovered that Minmus actually orbited the Sun with an orbital period identical to Kerbin, she was put on house arrest. Kerbals have since slain their gods and so Cardea's "Kerbolcentric Minmus" Theory is now accepted.\n\nIn modern times Minmus' classification is hotly debated, raising serious questions about what counts as a "planet," a "moon," an "asteroid," and whether we might be better off giving up on classifying celestial bodies into types and just call everything a "star," like in the good old days.
		}
	}
	
	@Body:HAS[#identifier[Squad/Duna]]
	{
		@Properties
		{
			%description = <color=#96432E>Duna</color> is called the "Red Planet" due to its...     orange color. Astronomers have developed a parallel science of color theory compared to the average Kerbal, likely due to the color-sensing cells in their retina being fatigued by the red lights they use to preserve their dark adaptation. Thus, we have such terms as "red planet," "red dwarf," "red giant," etc, which really refer to orange.\n\nDuna is half the size of Kerbin and is thought to posess a thin atmosphere. It has large white regions in the higher latitudes. These were once thought to be enormous salt flats, based on the assumption that Duna, being red, was hotter than Kerbin.\n\nWe now expect Duna to be significantly colder than Kerbin, and consensus at the Kerbal Astronomical Society is that the white regions are ice caps, not unlike those found in in the polar regions of Kerbin. The bad news is this cuts the profitability to the table salt industry of Duna missions significantly. The good news is it may be a source of water for crewed missions.
		}
	}
	@Body:HAS[#identifier[Squad/Ike]]
	{
		@Properties
		{
			%description = <color=#706767>Ike</color> is a relatively large, grey object occasionally seen near Duna. There was much debate over whether Ike really existed or not. Its name, meaning "they will laugh," comes from an early meeting of the Kerbal Astrological Society, the predecessor of the Kerbal Astronomical Society. An astrologer claimed to have made detailed observations of Ike's position over time and its proximity to Duna, as well as detailed horoscopes accounting for the extra object. That astrologer was laughed out of the room, and when the horoscope's predictions failed to come true, it was taken as evidence against Ike's existence.\n\nSince then, Ike has been shown to exist via telescopic observations; indeed any typical opera glass will show it readily. Due to its proximity to Duna and relatively high mass, scientists have postulated that Ike is perfectly positioned to sneakily interfere with any object that presumes to come near its companion.
			//fuck "Dres does not exist" memes we're doing "Ike does not exist."
		}
	}
	
	@Body:HAS[#identifier[Squad/Dres]]
	{
		@Properties
		{
			%description = <color=#7D7773>Dres</color> is a small object orbiting the Sun. Its orbit is highly irregular and, together with its size, it took a long time to discover since half the time it was not where scientists expected to find a planet.\n\nThe absence of a planet fitting into the obvious slot between Duna and Jool bothered astronomers for a long time, and a systematic search for the missing planet began. That search failed; they found Dres instead. Occultation studies made while Dres passed in front of a background star have revealed that it is roughly spherical in shape (go figure) and that it posseses a faint but wide ring system.\n\nDue to its nature of frequenting the bad parts of space, this dwarf planet was officially labeled as “Not to be trusted” by the scientific community. One wonders if its ring was even acquired legitimately.
		}
	}
	
	@Body:HAS[#identifier[Squad/Jool]]
	{
		@Properties
		{
			%description = Many blessings in Kerbalkind's history have been attributed to <color=#A0B70B>Jool,</color> as ancient Kerbals associated the green star in the night sky with a distant yet immanent goddess watching over them. To scientists, this planet is not a smidge less alluring. \n\nJool is a gas giant: a planet made of hydrogen and helium, same as Kerbol and the stars. It's covered in clouds arranged into latitudinal belts and zones. Occasional storms flare up in its atmosphere, visible for weeks or even years at a time as pale or dark spots drifting through the cloud belts. Contrary to popular belief, Jool is not "just a big cloud;" rather it is a huge mass of hot, dense liquid.\n\nThe first gas giant of the Kerbol system hosts many anomalies, but two stand out: The brilliant green hue and the three planet-sized moons.\n\nTwo main hypotheses have been invoked to explain Jool's magnificent coloration.\n    1) The atmosphere is rich in chlorine gas.\n    2) The clouds are actually a floating jungle of some kind.\nThe truth remains to be seen, and investigation into this anomaly is considered by many Joologists to be one of space exploration's most pressing goals.\n\nJool's moons are so large that they would make excellent targets for gravitational slingshots--a spacecraft might not need to use any propulsion at all to enter orbit of Jool, so long as it can target one or two of its moons on the way in. Jool itself also acts as a gravitational gateway to the outer Kerbol system, by the same principle.\n\nIf you look at Jool through a telescope, it's small and fuzzy; however astronomers assure us that the planet itself is actually very large and in at least 4K resolution.
		}
	}
	@Body:HAS[#identifier[Squad/Laythe]]
	{
		@Properties
		{
			%description = Jool's three large moons are visible to the unaided eye if you squint really hard, but because squinting wasn't invented until after the invention of the telescope, it took until then for its satellites to be found. The first astronomer to resolve <color=#2F4671>Laythe</color> used a Reflector telescope, which uses mirrors rather than lenses to form an image. When he first laid eyes upon it, he recorded it in his notes as a mere reflection of Kerbin. One of the computers at the university--in those days a "computer" was a person, not a machine--caught the mistake and informed the head astronomer that "telescopes don't work that way." She was then "promoted" to the university's "marvelous flying contraption" department.\n\nLaythe is a blue planet-like moon nearly as large as Kerbin, and with white fluffy clouds to boot, so it's no surprise that it has been mistaken for Kerbin. It has inspired many artists to consider how Kerbin might appear from the same distance, although a much more pressing question is that of what Laythe looks like up close. Is it indeed covered in oceans, as its appearance suggests? Doubtful, for Kerbol does not shine brightly enough in the Jool system. It is more likely that Laythe is covered in either a solid, almost glassy ice, or perhaps that its oceans are made of a mixture of water and industrial-strength antifreeze.
		}
	}
	@Body:HAS[#identifier[Squad/Vall]]
	{
		@Properties
		{
			%description = <color=#AFBDC8>Vall</color> is the smallest of Jool's three large moons, barely bigger than Duna. Vall is named for a mythical creature which sucks the blood out of hapless Kerbals, due to a peculiar quirk of its observation history. Vall, as well as the other two large Joolean moons, was discovered using small refractor telescopes--those which use lenses. However, at that time, it was visible only as a pale blue dot. When reflector telescopes (which use mirrors) were invented, Garble University's observatory installed a large-aperture reflector.\n\nThe Garble Observatory's new massive telescope was a contested resource among the astronomy faculty, and eventually they settled on a system where each of the five astronomers would take turns one after another, so each would get to use the telescope once every five nights. Joologist Simarie Kerman's field of research was in Joolean meteorology, and so when it was her turn, she watched Jool intently. She saw most of the moons, and phenomenal detail in Jool's clouds, but she couldn't see the second moon. The night after, she followed up with her own personal refractor telescope, and found the moon. But on her next observing session with the reflector on campus, she again missed it. But she could see it each of the other nights she looked with her refractor.\n\nThis went on for nearly a month before Simarie Kerman published her results: Jool's second moon was invisible to mirrors, which could mean only one thing: It was a Space-Vall. Though the paper was swiftly retracted after one of her colleagues saw Vall with the big reflector, and it turned out that the moon was merely behind Jool on each of Simarie's observing nights, the media ran with it, and the name "Vall" stuck.\n\nAs for Vall itself, little is known about it, though spectroscopic analysis suggests that it may have "ice" on the surface. Unfortunately planetary scientists use "ice" to mean all sorts of volatile chemicals in any state of matter, so who knows what the blasted thing is made of.

			//in Reborn mode Vall is a bit smaller than Duna

			descriptionReborn = <color=#AFBDC8>Vall</color> is the smallest of Jool's three large moons, barely smaller than Duna. Vall is named for a mythical creature which sucks the blood out of hapless Kerbals, due to a peculiar quirk of its observation history. Vall, as well as the other two large Joolean moons, was discovered using small refractor telescopes--those which use lenses. However, at that time, it was visible only as a pale blue dot. When reflector telescopes (which use mirrors) were invented, Garble University's observatory installed a large-aperture reflector.\n\nThe Garble Observatory's new massive telescope was a contested resource among the astronomy faculty, and eventually they settled on a system where each of the five astronomers would take turns one after another, so each would get to use the telescope once every five nights. Joologist Simarie Kerman's field of research was in Joolean meteorology, and so when it was her turn, she watched Jool intently. She saw most of the moons, and phenomenal detail in Jool's clouds, but she couldn't see the second moon. The night after, she followed up with her own personal refractor telescope, and found the moon. But on her next observing session with the reflector on campus, she again missed it. But she could see it each of the other nights she looked with her refractor.\n\nThis went on for nearly a month before Simarie Kerman published her results: Jool's second moon was invisible to mirrors, which could mean only one thing: It was a Space-Vall. Though the paper was swiftly retracted after one of her colleagues saw Vall with the big reflector, and it turned out that the moon was merely behind Jool on each of Simarie's observing nights, the media ran with it, and the name "Vall" stuck.\n\nAs for Vall itself, little is known about it, though spectroscopic analysis suggests that it may have "ice" on the surface. Unfortunately planetary scientists use "ice" to mean all sorts of volatile chemicals in any state of matter, so who knows what the blasted thing is made of.
		}
	}
	@Body:HAS[#identifier[Squad/Tylo]]
	{
		@Properties			//ill have to remember to update this for the expansion pack since sothebin will be the largest moon in the kerbol system
		{
			%description = <color=#998461>Tylo</color> is Jool's mostly readily visible moon, and can be seen with an opera glass quite easily, or even with the squinted eye by a skilled observer when conditions are right. It is nearly the size of Kerbin, making it by far the largest moon in the Kerbol system.\n\nTylo appears very different from its sister satellite Laythe, despite the similar size. It is a large brown object which does not appear to have a thick atmosphere, unlike most of the planets and Laythe.\n\nMeasurements of Tylo's atmosphere from occultation studies have constrained its atmospheric pressure to less than 0.006 times that of Kerbin, so any native inhabitants are expected to have lungs somewhere on the order of 170 times larger than those of the average Kerbal.\n\nIt is recommended to bring a parachute on a Tylo lander--not because it'll help with landing, it probably won't--but just to check if there's any air at all.
		}
	}
	@Body:HAS[#identifier[Squad/Bop]]
	{
		@Properties
		{
			%description = <color=#876A64>Bop</color> is a small moon in the vicinity of Jool. In Kerbal mythology, Bop is believed to be the home of the Kraken, a mischievous creature said to play with the ships of hapless explorers, by spinning them out of control until torn asunder, then casting them into oblivion.\n\nBop was the first moon to be discovered using photography instead of visual observations. After many failed attempts to take a flawless picture of Jool to hang on the office walls, it was finally discovered that the wandering smear was indeed a moon. Little is known about Bop; it's small enough that even the largest telescopes can not resolve any features. The object appears little more than a star-like dot, and hence it is often included among the ranks of "asteroids." \n\nScientists speculate that the view from the surface with Laythe, Vall, Tylo, and Jool overhead must be "quite something".
		}
	}
	@Body:HAS[#identifier[Squad/Pol]]
	{
		@Properties
		{
			%description = Jool's outermost known moon, <color=#A59561>Pol,</color> was especially hard to spot, as it looks just like a pollen grain, particularly when observed through telescopes based near dusty fields.\n\nPol was finally discovered when Elara Kerman, a computer at the Harvester Observatory tasked with cataloging photographic plates, decided to write down the location of the pollen. Its name comes from the label applied by Elara to the relevant plates.\n\nPol's slightly reddish hue indicates the possible presence of organic materials, so it's not out of the question that it could indeed be a very large grain of pollen, though the scientific community calls this "a stretch" and the very idea "an affront to nature."
		}
	}
	
	@Body:HAS[#identifier[Squad/Eeloo]]
	{
		@Properties
		{
			%description = Upon its discovery, <color=#C4BEB4>Eeloo</color> was hailed as the Sixth Planet, the first planet to be discovered photographically. However, initial estimates of its size assumed that it was very dark, similar to Tylo, and therefore larger than Kerbin. More refined measurements have shown that Eeloo is actually highly reflective, implying a smaller size, more like the Mun.\n\nIn addition, its orbit was found to cross Jool's, unlike any other planet. And finally, it was found to rise far above the plane of the Kerbol system, more like Dres and the asteroids. Since then there has been a considerable amount of controversy around the status of Eeloo as being a proper planet or a just a “lump of ice going around the Sun.”\n\nThe debate is still ongoing, as most academic summits held to address the issue have devolved into, on good days, petty name calling, and on worse ones, all-out brawls.
			
			//make sure this description is not applied when OPM is in use. (See bottom of this config)
		}
	}
}

